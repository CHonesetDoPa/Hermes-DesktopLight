
name: Build Hermes Desktop Light - Windows x64

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Official Hermes source branch, tag, or full commit SHA"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-light-windows-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 Portable Light
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

      # --------------------------------------------------
      # 1. Checkout official Hermes source
      # --------------------------------------------------

      - name: Checkout official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.source_ref }}
          path: hermes-src
          fetch-depth: 0
          persist-credentials: false

      # --------------------------------------------------
      # 2. Resolve exact source commit
      # --------------------------------------------------

      - name: Resolve source commit
        id: source
        shell: pwsh
        working-directory: hermes-src
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $sha = (git rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve source commit."
          }

          if ($sha -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid commit SHA: $sha"
          }

          Write-Host "Requested ref: $env:SOURCE_REF"
          Write-Host "Resolved commit: $sha"

          "sha=$sha" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # 3. Verify runner architecture
      # --------------------------------------------------

      - name: Verify Windows x64 runner
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "Windows x64 is required."
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

          Write-Host "Windows x64 runner verified."

      # --------------------------------------------------
      # 4. Install bootstrap Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python and Git
        shell: pwsh
        run: |
          python --version
          git --version

      # --------------------------------------------------
      # 5. Install Node.js for the unpacked packaging step
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hermes-src/package-lock.json

      - name: Verify Node.js
        shell: pwsh
        run: |
          node --version
          npm --version

      # --------------------------------------------------
      # 6. Install locked workspace dependencies
      # --------------------------------------------------

      - name: Install Hermes workspace dependencies
        shell: pwsh
        working-directory: hermes-src
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed."
          }

      # --------------------------------------------------
      # 7. Verify clean source checkout
      # --------------------------------------------------

      - name: Verify source checkout
        shell: pwsh
        working-directory: hermes-src
        run: |
          $status = git status --porcelain

          if ($status) {
            Write-Host $status
            throw "Source checkout is not clean."
          }

          $head = (git rev-parse HEAD).Trim()
          $expected = "${{ steps.source.outputs.sha }}"

          if ($head -ne $expected) {
            throw "HEAD does not match the requested source commit."
          }

          Write-Host "Source checkout verified: $head"

      # --------------------------------------------------
      # 8. Build official Hermes Desktop Light
      # --------------------------------------------------

      - name: Build Hermes Desktop Light
        shell: pwsh
        working-directory: hermes-src
        env:
          CI: "true"
          PYTHONUTF8: "1"
        run: |
          $sha = "${{ steps.source.outputs.sha }}"

          Write-Host "Building Hermes Desktop Light"
          Write-Host "Commit: $sha"

          python scripts/bundles/desktop.py `
            --commit=$sha `
            --variant=light

          if ($LASTEXITCODE -ne 0) {
            throw "Hermes Desktop Light build failed."
          }

      # --------------------------------------------------
      # 9. Create unpacked Electron application
      # --------------------------------------------------

      - name: Package unpacked Windows application
        shell: pwsh
        working-directory: hermes-src/apps/desktop
        env:
          CI: "true"
        run: |
          npm run pack

          if ($LASTEXITCODE -ne 0) {
            throw "Electron unpacked packaging failed."
          }

      # --------------------------------------------------
      # 10. Verify unpacked application exists
      # --------------------------------------------------

      - name: Verify unpacked application
        shell: pwsh
        working-directory: hermes-src
        run: |
          $appDir = Join-Path $PWD "apps/desktop/release/win-unpacked"

          if (!(Test-Path $appDir -PathType Container)) {
            throw "Unpacked application directory not found: $appDir"
          }

          $exe = Join-Path $appDir "Hermes.exe"

          if (!(Test-Path $exe -PathType Leaf)) {
            throw "Hermes.exe is missing."
          }

          $asar = Join-Path $appDir "resources/app.asar"

          if (!(Test-Path $asar -PathType Leaf)) {
            throw "resources/app.asar is missing."
          }

          Write-Host "PASS: Hermes.exe exists."
          Write-Host "PASS: resources/app.asar exists."

      # --------------------------------------------------
      # 11. Verify executable architecture
      # --------------------------------------------------

      - name: Verify executable is x64
        shell: pwsh
        working-directory: hermes-src
        run: |
          $exe = Join-Path $PWD "apps/desktop/release/win-unpacked/Hermes.exe"

          $bytes = [System.IO.File]::ReadAllBytes($exe)

          if ($bytes.Length -lt 256) {
            throw "Invalid executable."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw "Invalid PE header."
          }

          $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes, $peOffset, 4
          )

          if ($signature -ne "PE`0`0") {
            throw "Invalid PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
            throw "Expected AMD64 PE (0x8664), got 0x$($machine.ToString('X4'))"
          }

          Write-Host "PASS: Hermes.exe is Windows x64."

      # --------------------------------------------------
      # 12. Verify no local Agent payload
      # --------------------------------------------------

      - name: Verify no local Agent payload
        shell: pwsh
        working-directory: hermes-src
        run: |
          $appDir = Join-Path $PWD "apps/desktop/release/win-unpacked"

          $agentDirs = @(
            Get-ChildItem $appDir -Directory -Recurse -Force |
            Where-Object {
              $_.Name -eq "agent-payload"
            }
          )

          if ($agentDirs.Count -gt 0) {
            $agentDirs | ForEach-Object {
              Write-Host $_.FullName
            }

            throw "Local Agent payload detected."
          }

          $agentPayload = Join-Path $appDir "resources/agent-payload"

          if (Test-Path $agentPayload) {
            throw "resources/agent-payload exists."
          }

          Write-Host "PASS: No local Agent payload directory."

      # --------------------------------------------------
      # 13. Verify no Python runtime
      # --------------------------------------------------

      - name: Verify no Python runtime
        shell: pwsh
        working-directory: hermes-src
        run: |
          $appDir = Join-Path $PWD "apps/desktop/release/win-unpacked"

          $pythonExecutables = @(
            Get-ChildItem $appDir -File -Recurse -Force |
            Where-Object {
              $_.Name -match '^(python|pythonw)([0-9.]*)?\.exe$'
            }
          )

          if ($pythonExecutables.Count -gt 0) {
            $pythonExecutables | ForEach-Object {
              Write-Host "Unexpected file: $($_.FullName)"
            }

            throw "Python executable found in application."
          }

          $pythonDlls = @(
            Get-ChildItem $appDir -File -Recurse -Force |
            Where-Object {
              $_.Name -match '^python3[0-9]*\.dll$'
            }
          )

          if ($pythonDlls.Count -gt 0) {
            $pythonDlls | ForEach-Object {
              Write-Host "Unexpected file: $($_.FullName)"
            }

            throw "Python runtime DLL found in application."
          }

          Write-Host "PASS: No Python executable."
          Write-Host "PASS: No Python runtime DLL."

      # --------------------------------------------------
      # 14. Create portable ZIP
      # --------------------------------------------------

      - name: Create portable ZIP
        shell: pwsh
        working-directory: hermes-src
        run: |
          $appDir = Join-Path $PWD "apps/desktop/release/win-unpacked"

          $outDir = Join-Path $PWD "artifacts"

          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $zip = Join-Path $outDir "Hermes-Desktop-Light-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$appDir/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "Portable ZIP creation failed."
          }

          $size = (Get-Item $zip).Length / 1MB

          Write-Host "Portable ZIP created."
          Write-Host "Size: $([math]::Round($size, 2)) MB"

      # --------------------------------------------------
      # 15. Extract and verify ZIP
      # --------------------------------------------------

      - name: Verify portable ZIP
        shell: pwsh
        working-directory: hermes-src
        run: |
          $zip = Join-Path $PWD "artifacts/Hermes-Desktop-Light-Windows-x64.zip"

          $temp = Join-Path $env:RUNNER_TEMP "hermes-light-zip-test"

          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $zip `
            -DestinationPath $temp `
            -Force

          $exe = Join-Path $temp "Hermes.exe"

          if (!(Test-Path $exe)) {
            throw "Hermes.exe missing after ZIP extraction."
          }

          $asar = Join-Path $temp "resources/app.asar"

          if (!(Test-Path $asar)) {
            throw "app.asar missing after ZIP extraction."
          }

          $agentDirs = @(
            Get-ChildItem $temp -Directory -Recurse -Force |
            Where-Object { $_.Name -eq "agent-payload" }
          )

          if ($agentDirs.Count -gt 0) {
            throw "ZIP contains Agent payload."
          }

          $pythonFiles = @(
            Get-ChildItem $temp -File -Recurse -Force |
            Where-Object {
              $_.Name -match '^(python|pythonw)([0-9.]*)?\.exe$' -or
              $_.Name -match '^python3[0-9]*\.dll$'
            }
          )

          if ($pythonFiles.Count -gt 0) {
            throw "ZIP contains Python runtime files."
          }

          Write-Host "PASS: ZIP extraction works."
          Write-Host "PASS: Hermes.exe exists."
          Write-Host "PASS: app.asar exists."
          Write-Host "PASS: No Agent payload."
          Write-Host "PASS: No Python runtime."

      # --------------------------------------------------
      # 16. Write build information
      # --------------------------------------------------

      - name: Write build metadata
        shell: pwsh
        working-directory: hermes-src
        run: |
          $metadata = [ordered]@{
            application = "Hermes Desktop Light"
            repository = "NousResearch/hermes-agent"
            requested_ref = "${{ inputs.source_ref }}"
            commit = "${{ steps.source.outputs.sha }}"
            platform = "Windows"
            architecture = "x64"
            variant = "light"
            packaging = "Electron unpacked directory"
            local_agent_included = $false
            python_runtime_included = $false
            build_date_utc = (Get-Date).ToUniversalTime().ToString("o")
          }

          $metadata |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -Path "artifacts/build-info.json" `
              -Encoding utf8

      # --------------------------------------------------
      # 17. Upload artifact
      # --------------------------------------------------

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Desktop-Light-Windows-x64
          path: hermes-src/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
