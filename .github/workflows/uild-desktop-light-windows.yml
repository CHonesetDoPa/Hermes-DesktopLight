
name: Build Hermes Desktop Light

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Official Hermes source branch, tag, or commit"
        required: true
        default: "main"
        type: string

      release_name:
        description: "Optional GitHub Release name"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-light-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 Light ZIP
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      # Checkout this repository: it contains release.md.
      - name: Checkout release repository
        uses: actions/checkout@v4

      # Checkout the actual Hermes source repository.
      - name: Checkout official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.source_ref }}
          path: hermes-source
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: pwsh
        run: |
          $sha = git -C hermes-source rev-parse HEAD
          $short = $sha.Substring(0, 7)
          $ref = "${{ inputs.source_ref }}"

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          "source_ref=$ref" >> $env:GITHUB_OUTPUT

          Write-Host "Source ref: $ref"
          Write-Host "Source commit: $sha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show build source
        shell: pwsh
        run: |
          git -C hermes-source status --short
          git -C hermes-source log -1 --oneline

      # Official full desktop build preparation.
      # Light is the remote-only variant.
      - name: Build official Hermes Desktop Light
        shell: pwsh
        working-directory: hermes-source
        run: |
          python scripts/bundles/desktop.py `
            --commit=${{ steps.source.outputs.sha }} `
            --variant=light

      # Package the already-built Light desktop as an unpacked app.
      # npm run pack uses electron-builder's --dir mode, not an installer.
      - name: Package unpacked Windows application
        shell: pwsh
        working-directory: hermes-source
        run: |
          npm run pack --workspace apps/desktop

      - name: Locate and validate portable application
        id: app
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "hermes-source/apps/desktop/release"

          if (!(Test-Path $releaseDir)) {
            throw "Desktop release directory not found: $releaseDir"
          }

          $exe = Get-ChildItem -Path $releaseDir -Filter "Hermes.exe" -Recurse -File |
            Where-Object { $_.FullName -match "win-unpacked" } |
            Select-Object -First 1

          if (!$exe) {
            throw "Hermes.exe was not found in the unpacked Windows build."
          }

          $appDir = $exe.Directory.FullName
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "portable-stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item -Path (Join-Path $appDir "*") -Destination $stageDir -Recurse -Force

          if (!(Test-Path (Join-Path $stageDir "Hermes.exe"))) {
            throw "Hermes.exe missing from portable staging directory."
          }

          # Basic payload checks. These do not replace a clean-machine runtime test.
          $pythonFiles = Get-ChildItem $stageDir -Recurse -File |
            Where-Object {
              $_.Name -match '^(python|python3)(\.exe)?$' -or
              $_.FullName -match '\\(python|python3|site-packages)\\'
            }

          if ($pythonFiles) {
            throw "Possible Python runtime found in Light package."
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE "Hermes-DesktopLight-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zip -CompressionLevel Optimal

          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Portable ZIP created: $zip"

      - name: Generate release notes
        shell: pwsh
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_REPOSITORY: ${{ github.repository }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          $templatePath = Join-Path $env:GITHUB_WORKSPACE "release.md"

          if (!(Test-Path $templatePath)) {
            throw "release.md template not found in the release repository."
          }

          $notes = Get-Content $templatePath -Raw

          $notes = $notes.Replace("{{SOURCE_REF}}", $env:SOURCE_REF)
          $notes = $notes.Replace("{{SOURCE_COMMIT}}", $env:SOURCE_SHA)
          $notes = $notes.Replace("{{SHORT_SHA}}", $env:SHORT_SHA)
          $notes = $notes.Replace("{{BUILD_DATE}}", (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"))
          $notes = $notes.Replace("{{WORKFLOW_URL}}", $env:WORKFLOW_URL)
          $notes = $notes.Replace("{{BUILD_REPOSITORY}}", $env:BUILD_REPOSITORY)

          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

          $tag = "desktop-light-$($env:SHORT_SHA)-${{ github.run_id }}-${{ github.run_attempt }}"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

          if ($env:RELEASE_NAME) {
            "release_name=$($env:RELEASE_NAME)" >> $env:GITHUB_OUTPUT
          } else {
            "release_name=Hermes Desktop Light Windows ($($env:SHORT_SHA))" >> $env:GITHUB_OUTPUT
          }
        id: notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.release_tag }}
          name: ${{ steps.notes.outputs.release_name }}
          body_path: release-notes.md
          files: Hermes-DesktopLight-Windows-x64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
